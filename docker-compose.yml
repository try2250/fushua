version: "3.8"

services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://fushua:${POSTGRES_PASSWORD:-fushua_dev}@postgres:5432/fushua}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - HTTPS_ONLY=${HTTPS_ONLY:-false}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fushua
      POSTGRES_USER: fushua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fushua_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fushua"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  pg_data:
