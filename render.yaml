services:
  - type: web
    name: fushua
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -c gunicorn.conf.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fushua-db
          property: connectionString
      - key: HTTPS_ONLY
        value: "true"
      - key: ENVIRONMENT
        value: "production"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: BACKUP_SECRET
        generateValue: true

  - type: cron
    name: fushua-backup
    runtime: docker
    schedule: "0 2 * * *"
    dockerCommand: >
      curl -X POST https://fushua.onrender.com/admin/backup/trigger
      -H "X-Backup-Secret: $BACKUP_SECRET"
      -H "Content-Type: application/json"
    envVars:
      - key: BACKUP_SECRET
        sync: false

databases:
  - name: fushua-db
    plan: free
