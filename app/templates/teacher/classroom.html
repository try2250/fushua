    <!-- Classroom API Adapter -->
    <script src="/static/classroom-api.js"></script>

    <!-- Core Libraries (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', secondary: '#10b981', accent: '#f59e0b', danger: '#ef4444' },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'bounce-in': 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-in': 'slideIn 0.4s cubic-bezier(0.23, 1, 0.320, 1) forwards',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        bounceIn: {
                            '0%': { opacity: '0', transform: 'scale(0.3)' },
                            '50%': { opacity: '1', transform: 'scale(1.05)' },
                            '70%': { transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f3f4f6; user-select: none; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .confetti-dot {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 50%;
            animation: fall 1s ease-out forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100px) scale(1); opacity: 0; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        // --- 2. Audio Service (Browser Native) ---
        const AudioService = {
            ctx: null,
            getCtx: () => {
                if (!AudioService.ctx) {
                    AudioService.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (AudioService.ctx.state === 'suspended') AudioService.ctx.resume();
                return AudioService.ctx;
            },
            playTick: () => {
                try {
                    const ctx = AudioService.getCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } catch(e){}
            },
            playSuccess: () => {
                try {
                    const ctx = AudioService.getCtx();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    osc.start();
                    osc.stop(now + 0.8);
                } catch(e){}
            },
            playFailure: () => {
                try {
                    const ctx = AudioService.getCtx();
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start();
                    osc.stop(now + 0.3);
                } catch(e){}
            },
            playFanfare: () => {
                try {
                    const ctx = AudioService.getCtx();
                    const now = ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'triangle';
                        osc.frequency.value = freq;
                        const start = now + i * 0.08;
                        const duration = 0.4;
                        gain.gain.setValueAtTime(0, start);
                        gain.gain.linearRampToValueAtTime(0.1, start + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
                        osc.start(start);
                        osc.stop(start + duration + 0.1);
                    });
                } catch(e){}
            },
            playBell: () => {
                try {
                    const ctx = AudioService.getCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(660, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } catch(e){}
            }
        };

        // --- 3. Constants & Helpers ---
        const ViewState = { DASHBOARD: 'DASHBOARD', STUDENTS: 'STUDENTS', QUESTIONS: 'QUESTIONS', SESSION: 'SESSION', STATS: 'STATS', DATA: 'DATA' };
        const SESSION_STATE = { IDLE: 'idle', STUDENT_SELECTED: 'student_selected', QUESTION_SELECTED: 'question_selected' };
        const generateId = () => Math.random().toString(36).substring(2, 9);

        // 云端空状态 - 不再从 localStorage 加载业务数据
        const emptyClassroomState = () => ({
            classes: [],
            activeClassId: null,
            students: [],
            questions: [],
            activeSession: null,
            sessionState: {},
            _apiLoaded: false
        });

        const loadState = () => emptyClassroomState();

        const saveState = (state) => {
            if (!ClassroomAPI.currentSessionId) return;
            ClassroomAPI.saveSessionState(ClassroomAPI.currentSessionId, {
                currentQuestionId: state.currentQuestionId || null,
                selectedStudentId: state.selectedStudentId || null,
                sessionMode: state.sessionMode || 'normal',
                askedQuestionIds: state.askedQuestionIds || [],
                streakCount: state.streakCount || 0,
                groups: state.groups || [],
            }).catch(e => console.error('状态保存失败:', e));
        };

        // 抽取历史管理器 - 云端版本
        const DrawHistoryManager = {
            _records: [],
            get: (classId) => {
                // 同步返回内存缓存，用于 UI 渲染和权重计算
                return DrawHistoryManager._records;
            },
            add: async (classId, studentId, questionId, result, scoreDelta) => {
                if (!ClassroomAPI.currentSessionId) return null;
                try {
                    const record = await ClassroomAPI.createDrawRecord(studentId, questionId, result, scoreDelta, '');
                    // 更新本地缓存
                    DrawHistoryManager._records.push({
                        id: record.id,
                        student_id: studentId,
                        studentId: studentId,
                        student_name: '',
                        studentName: '',
                        result: result,
                        score_delta: scoreDelta,
                        created_at: record.created_at || '',
                        time: new Date().toLocaleString('zh-CN'),
                    });
                    return record;
                } catch (e) {
                    console.error('保存抽取记录失败:', e);
                    return null;
                }
            },
            clear: async (classId) => {
                DrawHistoryManager._records = [];
            },
            getStats: async (classId) => {
                try {
                    const records = DrawHistoryManager.get(classId);
                    const stats = {};
                    records.forEach(r => {
                        const sid = r.student_id || r.studentId;
                        if (!stats[sid]) stats[sid] = { correct: 0, wrong: 0, skip: 0, score: 0 };
                        stats[sid][r.result] = (stats[sid][r.result] || 0) + 1;
                        stats[sid].score += r.score_delta || 0;
                    });
                    return stats;
                } catch (e) { return {}; }
            }
        };

        // >>> (其他组件保持不变: DataCenter, QuestionManager, StudentManager, Statistics, Dashboard)
        // 下面会在第2个代码块中补充
        // >>> Data Management Center
        const DataCenter = ({ state, setState }) => {
            const [snapshots, setSnapshots] = useState(SnapshotManager.get());
            const fileInputRef = useRef(null);

            const handleSmartBackup = async () => {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const fileName = `课堂伴侣_备份_${new Date().toISOString().slice(0,10)}.json`;
                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: fileName,
                            types: [{ description: 'JSON Database', accept: { 'application/json': ['.json'] } }],
                        });
                        const writable = await handle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        alert("✅ 备份已成功保存到指定位置！");
                        return;
                    } catch (err) { if (err.name !== 'AbortError') console.error(err); else return; }
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fileName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if(confirm("确定要恢复此备份吗？\n警告：当前数据将被覆盖！(会自动生成一个还原前的快照)")) {
                            SnapshotManager.add(state);

                            setState(data);
                            alert("恢复成功！");
                        }
                    } catch (err) { alert("文件格式错误，请检查是否为有效的 JSON 备份文件。"); }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const restoreSnapshot = (snap) => {
                if(confirm(`确定要回滚到时间点 [${new Date(snap.timestamp).toLocaleString()}] 吗？`)) {

                                    </button>
                                </div>
                            </div>
                        </div>

                        {showHelp && (
                            <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl mb-6 animate-bounce-in text-sm text-blue-800">
                                <div className="font-bold text-lg mb-2 flex items-center"><Icons.BookOpen /> 导入格式说明 (支持 TXT 或 CSV)</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <p className="font-semibold">方式一：简单模式</p>
                                        <p className="text-blue-600 opacity-80">每行只写一个问题。</p>
                                        <div className="bg-white p-2 rounded mt-1 text-xs border border-blue-100 font-mono">
                                            1+1等于几?<br/>
                                            唐朝的首都在哪里?
                                        </div>
                                    </div>
                                    <div>
                                        <p className="font-semibold">方式二：完整模式</p>
                                        <p className="text-blue-600 opacity-80">题目, 难度, 科目, 参考答案</p>
                                        <div className="bg-white p-2 rounded mt-1 text-xs border border-blue-100 font-mono">
                                            1+1等于几?, 简单, 数学, 2<br/>
                                            相对论是谁提出的?, 困难, 物理, 爱因斯坦
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-4 pt-3 border-t border-blue-200">
                                    <button onClick={addDemoData} className="text-blue-700 font-bold hover:underline flex items-center">
                                        <Icons.Zap /> <span className="ml-1">没有文件？点我一键生成演示题目</span>
                                    </button>
                                </div>
                            </div>
                        )}
                        
                        <div className="space-y-4">
                            <textarea value={content} onChange={(e) => setContent(e.target.value)} placeholder="请输入题目内容..." className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none h-24 resize-none" />
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
                                <div className="md:col-span-2">
                                    <select value={difficulty} onChange={(e) => setDifficulty(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg bg-white">
                                        <option value="Easy">简单</option><option value="Medium">中等</option><option value="Hard">困难</option>
                                    </select>
                                </div>
                                <div className="md:col-span-3">
                                    <input type="text" value={subject} onChange={(e) => setSubject(e.target.value)} placeholder="科目 (选填)" className="w-full p-3 border border-gray-300 rounded-lg" />
                                </div>
                                <div className="md:col-span-5">
                                    <input type="text" value={answer} onChange={(e) => setAnswer(e.target.value)} placeholder="参考答案/解析 (选填)" className="w-full p-3 border border-gray-300 rounded-lg" />
                                </div>
                                <div className="md:col-span-2">
                                    <button onClick={handleAdd} className="w-full p-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">保存题目</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="p-4 border-b border-gray-100 bg-gray-50 font-medium text-gray-500 grid grid-cols-12 gap-4">
                            <div className="col-span-6">题目内容</div><div className="col-span-3">参考答案</div><div className="col-span-1 text-center">难度</div><div className="col-span-1 text-center">科目</div><div className="col-span-1 text-center">操作</div>
                        </div>
                        <div className="divide-y divide-gray-100 max-h-[500px] overflow-y-auto">
                            {questions.map(q => (
                                <div key={q.id} className="p-4 grid grid-cols-12 gap-4 items-center hover:bg-gray-50">
                                    <div className="col-span-6 text-gray-800">{q.content}</div>
                                    <div className="col-span-3 text-sm text-gray-500 truncate" title={q.answer}>{q.answer || '-'}</div>
                                    <div className="col-span-1 text-center"><span className={`px-2 py-1 rounded text-xs font-medium ${q.difficulty === 'Easy' ? 'bg-green-100 text-green-700' : q.difficulty === 'Medium' ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}`}>{q.difficulty === 'Easy' ? '简单' : q.difficulty === 'Medium' ? '中等' : '困难'}</span></div>
                                    <div className="col-span-1 text-center text-sm text-gray-500">{q.subject || '-'}</div>
                                    <div className="col-span-1 text-center"><button onClick={() => handleDelete(q.id)} className="text-gray-400 hover:text-red-500 p-1 rounded transition"><Icons.Trash2 /></button></div>
                                </div>
                            ))}
                            {questions.length === 0 && <div className="p-8 text-center text-gray-400">暂无题目，请手动添加或导入</div>}
                        </div>
                    </div>
                </div>
            );
        };
        // >>> Enhanced Session Mode with Smart Drawing & History (OPTIMIZED)
        const SessionMode = ({ students, questions, onUpdateStudent, activeClass }) => {
            // Session State Machine
            const [sessionState, setSessionState] = useState(SESSION_STATE.IDLE);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [selectedQuestion, setSelectedQuestion] = useState(null);
            
            // Question Cycle Management
            const [askedQuestionIds, setAskedQuestionIds] = useState([]);
            const [questionMode, setQuestionMode] = useState('random');
            
            // Session Play Mode
            const [sessionPlayMode, setSessionPlayMode] = useState('standard');
            
            // UI States
            const [isRolling, setIsRolling] = useState(false);
            const [feedback, setFeedback] = useState(null);
            const [isAnswerShown, setIsAnswerShown] = useState(false);
            
            // Features
            const [streakCount, setStreakCount] = useState(0);
            const [showManualPicker, setShowManualPicker] = useState(false);
            const [showQuestionLibrary, setShowQuestionLibrary] = useState(false);
            const [showStudentSelectQuestionModal, setShowStudentSelectQuestionModal] = useState(false); 
            const [searchTerm, setSearchTerm] = useState('');
            const [timer, setTimer] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [showGroups, setShowGroups] = useState(false);
            const [groups, setGroups] = useState([]);
            const [showDrawHistory, setShowDrawHistory] = useState(false); // NEW

            // --- Smart Question Cycle Logic ---
            const getNextQuestion = useCallback(() => {
                if (questions.length === 0) return null;
                
                let candidates = questions.filter(q => !askedQuestionIds.includes(q.id));
                let resetting = false;

                if (candidates.length === 0) {
                    candidates = [...questions];
                    resetting = true;
                }

                if (selectedQuestion && candidates.length > 1) {
                    const filtered = candidates.filter(q => q.id !== selectedQuestion.id);
                    if (filtered.length > 0) candidates = filtered;
                }

                const nextQ = candidates[Math.floor(Math.random() * candidates.length)];
                const nextHistory = resetting ? [nextQ.id] : [...askedQuestionIds, nextQ.id];
                
                return { nextQ, nextHistory };
            }, [questions, askedQuestionIds, selectedQuestion]);

            // Timer Logic
            useEffect(() => {
                let interval;
                if(isTimerRunning && timer > 0) {
                    interval = setInterval(() => {
                        setTimer(t => {
                            if(t <= 1) { setIsTimerRunning(false); AudioService.playBell(); return 0; }
                            return t - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, timer]);

            // --- Reset Session State ---
            const resetSession = useCallback(() => {
                setSessionState(SESSION_STATE.IDLE);
                setSelectedStudent(null);
                setSelectedQuestion(null);
                setFeedback(null);
                setStreakCount(0);
                setIsAnswerShown(false);
                setAskedQuestionIds([]);
            }, []);

            // --- NEW: 防重复算法 ---
            // 用加权随机算法选择学生，最近被选中的学生权重较低
            const getWeightedRandomStudent = useCallback(() => {
                if (students.length === 0) return null;
                
                const drawHistory = DrawHistoryManager.get(activeClass.id);
                const recentRecords = drawHistory.slice(-Math.min(20, students.length)); // 只看最近20次
                const recentCounts = {};
                
                recentRecords.forEach(record => {
                    recentCounts[record.studentId] = (recentCounts[record.studentId] || 0) + 1;
                });
                
                // 计算权重：被选次数越少，权重越高
                const maxCount = Math.max(...Object.values(recentCounts), 0);
                const weights = students.map(student => {
                    const count = recentCounts[student.id] || 0;
                    return Math.max(maxCount - count + 1, 1);
                });
                
                // 加权随机选择
                const totalWeight = weights.reduce((a, b) => a + b, 0);
                let random = Math.random() * totalWeight;
                
                for (let i = 0; i < students.length; i++) {
                    random -= weights[i];
                    if (random <= 0) {
                        return students[i];
                    }
                }
                
                return students[0];
            }, [students, activeClass]);

            // --- State Machine: Step 1 - Pick Student with Smart Algorithm ---
            const handlePickRandomStudent = useCallback(() => {
                if (students.length === 0 || sessionState !== SESSION_STATE.IDLE) return;
                
                setIsRolling(true);
                setFeedback(null);
                setIsAnswerShown(false);
                setStreakCount(0);
                
                let counter = 0;
                const interval = setInterval(() => {
                    setSelectedStudent(students[Math.floor(Math.random() * students.length)]);
                    AudioService.playTick();
                    counter++;
                    if (counter > 20) {
                        clearInterval(interval);
                        
                        // 使用加权随机算法选择最终学生
                        const finalStudent = getWeightedRandomStudent();
                        if (finalStudent) {
                            setSelectedStudent(finalStudent);
                            
                            // 记录本次抽取 (NEW)
                            DrawHistoryManager.add(activeClass.id, finalStudent.id, null, 'manual', 0).catch(e => console.error('记录抽取失败:', e));
                            
                            setIsRolling(false);
                            AudioService.playFanfare();
                            setSessionState(SESSION_STATE.STUDENT_SELECTED);
                        }
                    }
                }, 80);
            }, [students, sessionState, getWeightedRandomStudent, activeClass]);

            const handleManualPickStudent = (student) => {
                setSelectedStudent(student);
                setSessionState(SESSION_STATE.STUDENT_SELECTED);
                setFeedback(null);
                setStreakCount(0);
                setIsAnswerShown(false);
                setShowManualPicker(false);
                
                // 记录本次定向选择 (NEW)
                DrawHistoryManager.add(activeClass.id, student.id, null, 'manual', 0).catch(e => console.error('记录抽取失败:', e));
                
                AudioService.playSuccess();
            };

            const handleSkipCurrentStudentAndRedraw = () => {
                resetSession();
                setTimeout(() => {
                    handlePickRandomStudent();
                }, 50);
            };

            // --- State Machine: Step 2 - Pick Question ---
            const handleRandomQuestion = () => {
                if (sessionState !== SESSION_STATE.STUDENT_SELECTED || !selectedStudent) {
                    alert('请先选择学生');
                    return;
                }
                
                const result = getNextQuestion();
                if (result) {
                    setSelectedQuestion(result.nextQ);
                    setAskedQuestionIds(result.nextHistory);
                    setSessionState(SESSION_STATE.QUESTION_SELECTED);
                    setIsAnswerShown(false);
                } else {
                    alert('题库中没有题目了！');
                    resetSession();
                }
            };

            const handleManualPickQuestion = (question) => {
                if (sessionState !== SESSION_STATE.STUDENT_SELECTED || !selectedStudent) {
                    alert('请先选择学生');
                    return;
                }
                
                setSelectedQuestion(question);
                setAskedQuestionIds(prev => {
                    if (prev.includes(question.id)) return prev;
                    return [...prev, question.id];
                });
                setSessionState(SESSION_STATE.QUESTION_SELECTED);
                setIsAnswerShown(false);
                setShowQuestionLibrary(false);
                setShowStudentSelectQuestionModal(false);
                AudioService.playSuccess();
            };

            // --- State Machine: Step 3 - Score ---
            const handleScore = (points) => {
                if (sessionState !== SESSION_STATE.QUESTION_SELECTED || !selectedStudent) return;
                
                if (points > 0) AudioService.playSuccess(); 
                else if (points < 0) AudioService.playFailure();
                
                const historyEntry = {
                    questionId: selectedQuestion?.id,
                    questionContent: selectedQuestion?.content,
                    points,
                    timestamp: Date.now()
                };

                // 持久化抽答记录到云端
                const resultMap = { 1: 'correct', 2: 'correct', '-1': 'wrong', 0: 'skip' };
                const drawResult = resultMap[String(points)] || 'manual';
                ClassroomAPI.createDrawRecord(
                    selectedStudent.id,
                    selectedQuestion?.id || null,
                    drawResult,
                    points,
                    ''
                ).catch(e => console.error('抽答记录保存失败:', e));

                const updatedStudent = {
                    ...selectedStudent,
                    score: selectedStudent.score + points,
                    history: [...selectedStudent.history, historyEntry]
                };

                onUpdateStudent(updatedStudent);
                setSelectedStudent(updatedStudent);

                setFeedback({ type: points > 0 ? 'success' : 'failure', points });

                setTimeout(() => {
                    setFeedback(null);
                    setIsAnswerShown(false);

                    if (sessionPlayMode === 'streak') {
                        if (points > 0) {
                            setStreakCount(s => s + 1);
                            const result = getNextQuestion();
                            if (result) {
                                setSelectedQuestion(result.nextQ);
                                setAskedQuestionIds(result.nextHistory);
                            } else {
                                alert('题库中没有更多题目了，闯关结束！');
                                resetSession();
                            }
                        } else {
                            resetSession();
                        }
                    } else if (sessionPlayMode === 'student_choice_flexible') {
                        if (points > 0) {
                            setStreakCount(s => s + 1);
                            const result = getNextQuestion();
                            if (result) {
                                setSelectedQuestion(result.nextQ);
                                setAskedQuestionIds(result.nextHistory);
                            } else {
                                alert('题库中没有更多题目了，连对结束！');
                                resetSession();
                            }
                        } else {
                            resetSession();
                        }
                    } else {
                        resetSession();
                    }
                }, 1500);
            };

            const generateGroups = (count) => {
                if(!count || count < 1) return;
                const shuffled = [...students].sort(() => 0.5 - Math.random());
                const newGroups = Array.from({length: count}, () => []);
                shuffled.forEach((s, i) => newGroups[i % count].push(s));
                setGroups(newGroups);
                setShowGroups(true);
            };

            if (!activeClass || students.length === 0) return <div className="flex flex-col items-center justify-center h-full text-gray-500"><Icons.HelpCircle /><p className="mt-4">请先在"班级与学生"中添加数据</p></div>;

            return (
                <div className="h-full flex flex-col relative space-y-4">
                    <ProcessIndicator currentState={sessionState} />

                    <div className="flex justify-between items-center px-4 py-2">
                        <div className="flex items-center bg-gray-100 rounded-full p-1 shadow-sm">
                            <button
                                onClick={() => { setSessionPlayMode('standard'); setStreakCount(0); resetSession(); }}
                                className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${sessionPlayMode === 'standard' ? 'bg-blue-500 text-white shadow' : 'text-gray-600 hover:bg-gray-200'}`}
                            >
                                普通模式
                            </button>
                            <button
                                onClick={() => { setSessionPlayMode('streak'); setStreakCount(0); resetSession(); }}
                                className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${sessionPlayMode === 'streak' ? 'bg-orange-500 text-white shadow' : 'text-gray-600 hover:bg-gray-200'}`}
                            >
                                闯关模式
                            </button>
                            <button
                                onClick={() => { setSessionPlayMode('student_choice_flexible'); setStreakCount(0); resetSession(); }}
                                className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${sessionPlayMode === 'student_choice_flexible' ? 'bg-purple-500 text-white shadow' : 'text-gray-600 hover:bg-gray-200'}`}
                            >
                                学生选题模式
                            </button>
                        </div>

                        <div className="flex items-center space-x-2">
                            <button
                                onClick={() => setShowDrawHistory(!showDrawHistory)}
                                className="px-4 py-2 bg-white rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-600 font-medium text-sm flex items-center gap-2 transition"
                            >
                                <Icons.History className="w-4 h-4" />
                                历史记录
                            </button>
                            
                            <div className="flex items-center bg-white rounded-lg border border-gray-200 p-1 shadow-sm">
                                <button onClick={() => setTimer(60)} className="px-3 py-1 hover:bg-gray-100 rounded text-xs text-gray-600">1分</button>
                                <button onClick={() => setTimer(180)} className="px-3 py-1 hover:bg-gray-100 rounded text-xs text-gray-600">3分</button>
                                <div className="w-px h-4 bg-gray-300 mx-1"></div>
                                <div className="px-2 font-mono font-bold text-lg w-16 text-center">{Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}</div>
                                <button onClick={() => setIsTimerRunning(!isTimerRunning)} className={`ml-2 p-1 rounded-full text-white ${isTimerRunning ? 'bg-red-500' : 'bg-green-500'}`}><Icons.Clock className="w-4 h-4" /></button>
                            </div>
                            <button onClick={() => { const c = prompt("分成几组?"); if(c) generateGroups(parseInt(c)); }} className="bg-white p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-600" title="随机分组"><Icons.Grid /></button>
                        </div>
                    </div>

                    <div className="flex-1 flex gap-4 min-h-0">
                        {/* Main Session Area */}
                        <div className="flex-1 flex flex-col items-center justify-center space-y-8 max-w-4xl mx-auto w-full">
                            <div className={`relative w-full max-w-lg aspect-video bg-white rounded-3xl shadow-2xl flex flex-col items-center justify-center p-8 transition-all transform duration-300 border-4 ${isRolling ? 'scale-95 border-blue-200' : 'scale-100 border-blue-500'} ${feedback?.type === 'failure' ? 'animate-shake border-red-400' : ''} ${feedback?.type === 'success' ? 'border-green-400' : ''}`}>
                                {!selectedStudent ? (
                                    <div className="text-gray-400 flex flex-col items-center">
                                        <Icons.Trophy className="w-16 h-16" />
                                        <span className="text-2xl font-light mt-4">准备开始提问</span>
                                        <span className="text-sm mt-2 font-medium bg-gray-100 px-3 py-1 rounded-full">{activeClass.name}</span>
                                    </div>
                                ) : (
                                    <>
                                        <div className="text-8xl font-black text-gray-800 tracking-tight mb-4 text-center">{selectedStudent.name}</div>
                                        <div className="flex items-center gap-3">
                                            <div className="text-2xl text-blue-600 font-medium bg-blue-50 px-6 py-2 rounded-full">积分: {selectedStudent.score}</div>
                                            {streakCount > 0 && (
                                                <div className="text-xl text-orange-600 font-bold bg-orange-100 px-4 py-2 rounded-full flex items-center animate-bounce">
                                                    <Icons.Flame className="w-5 h-5 mr-1" />连对 {streakCount}
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}
                                {feedback && (
                                    <div className="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-2xl flex items-center justify-center flex-col z-20 animate-pop">
                                        <div className={`text-6xl font-bold mb-4 ${feedback.type === 'success' ? 'text-green-500' : 'text-red-500'}`}>
                                            {feedback.points > 0 ? `+${feedback.points}` : feedback.points}
                                        </div>
                                        <div className="text-gray-600 text-xl font-medium flex items-center">
                                            {feedback.type === 'success' ? <><Icons.Check /> 回答正确！</> : <><Icons.X /> 继续加油！</>}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {selectedQuestion && sessionState === SESSION_STATE.QUESTION_SELECTED && !isRolling && !feedback && (
                                <div className="w-full max-w-2xl bg-indigo-50 border border-indigo-100 p-6 rounded-xl animate-slide-in shadow-md">
                                    <div className="flex items-center space-x-2 mb-2">
                                        <span className="text-xs px-2 py-1 rounded font-bold uppercase tracking-wider bg-blue-200 text-blue-800">{selectedQuestion.difficulty}</span>
                                        <span className="text-xs text-indigo-400 font-semibold uppercase">题目 ({askedQuestionIds.length}/{questions.length})</span>
                                    </div>
                                    <p className="text-xl text-indigo-900 font-medium leading-relaxed">{selectedQuestion.content}</p>
                                    {selectedQuestion.answer && (
                                        <div className="mt-4 pt-4 border-t border-indigo-200">
                                            {!isAnswerShown ? (
                                                <button onClick={() => setIsAnswerShown(true)} className="text-indigo-600 font-bold hover:underline flex items-center text-sm">
                                                    <Icons.Eye /> <span className="ml-2">查看参考答案</span>
                                                </button>
                                            ) : (
                                                <div className="animate-pop">
                                                    <span className="text-xs font-bold text-green-600 uppercase">参考答案</span>
                                                    <p className="text-gray-800 mt-1 font-medium">{selectedQuestion.answer}</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}

                            <div className="flex items-center gap-4 flex-wrap justify-center">
                                {sessionState === SESSION_STATE.IDLE && (
                                    <>
                                        <button 
                                            onClick={handlePickRandomStudent} 
                                            disabled={isRolling} 
                                            className={`flex items-center space-x-3 px-8 py-5 rounded-2xl text-2xl font-bold shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 ${isRolling ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:shadow-blue-500/30'}`}
                                        >
                                            <Icons.Shuffle />
                                            <span>{isRolling ? '抽取中...' : '随机抽查'}</span>
                                        </button>
                                        <button 
                                            onClick={() => setShowManualPicker(true)} 
                                            disabled={isRolling} 
                                            className="flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-white border-2 border-gray-200 text-gray-600 hover:border-blue-500 hover:text-blue-600 transition shadow-sm font-bold text-sm"
                                        >
                                            <Icons.List className="mb-1" />定向
                                        </button>
                                    </>
                                )}

                                {sessionState === SESSION_STATE.STUDENT_SELECTED && (
                                    <>
                                        {(sessionPlayMode === 'standard' || sessionPlayMode === 'streak') && (
                                            <button 
                                                onClick={handleRandomQuestion}
                                                className="flex items-center space-x-3 px-8 py-5 rounded-2xl text-2xl font-bold shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 bg-gradient-to-r from-green-600 to-teal-600 text-white hover:shadow-green-500/30"
                                            >
                                                <Icons.Shuffle />
                                                <span>随机抽题</span>
                                            </button>
                                        )}
                                        {sessionPlayMode === 'standard' && (
                                            <button 
                                                onClick={() => setShowQuestionLibrary(true)}
                                                className="flex items-center space-x-3 px-8 py-5 rounded-2xl text-2xl font-bold shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:shadow-purple-500/30"
                                            >
                                                <Icons.BookOpen />
                                                <span>指定题目</span>
                                            </button>
                                        )}
                                        {sessionPlayMode === 'student_choice_flexible' && ( 
                                            <button 
                                                onClick={() => setShowStudentSelectQuestionModal(true)}
                                                className="flex items-center space-x-3 px-8 py-5 rounded-2xl text-2xl font-bold shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 bg-gradient-to-r from-orange-600 to-amber-600 text-white hover:shadow-orange-500/30"
                                            >
                                                <Icons.Eye />
                                                <span>学生选题</span>
                                            </button>
                                        )}

                                        {sessionPlayMode === 'standard' && (
                                            <div className="flex bg-gray-100 rounded-lg p-1 shadow-sm">
                                                <button
                                                    onClick={() => setQuestionMode('random')}
                                                    className={`px-4 py-2 rounded-md transition-all ${questionMode === 'random' ? 'bg-white shadow text-blue-600 font-medium' : 'text-gray-600'}`}
                                                >

                                        <button onClick={() => handleScore(2)} className="flex flex-col items-center justify-center w-24 h-24 rounded-2xl bg-emerald-50 text-emerald-600 border-2 border-emerald-100 hover:bg-emerald-100 transition"><Icons.Check /><Icons.Check className="-mt-3" /><span className="font-bold text-lg">+2</span></button>
                                        
                                        <button

                    {showManualPicker && (

                                            {s.name}
                                        </button>

                                </div>
                            </div>
                        </div>

                    {showQuestionLibrary && (

                                                    <span className={`

                                                        ${question.difficulty === 'Medium' ? 'bg-yellow-200 text-yellow-800' : ''}

                                                        <span className="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">

                                                    选择 →
