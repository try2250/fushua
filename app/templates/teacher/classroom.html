                                            </div>
                                            <p className="font-medium">{question.content}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showStudentSelectQuestionModal && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-8 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[80%] flex flex-col overflow-hidden animate-bounce-in">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-gray-800">请学生选择题目</h3>
                                    <button onClick={() => setShowStudentSelectQuestionModal(false)} className="p-2 hover:bg-gray-100 rounded-full"><Icons.X /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {questions.map((question) => (
                                        <button
                                            key={question.id}
                                            onClick={() => handleManualPickQuestion(question)}
                                            className="text-left p-4 border-2 border-gray-100 rounded-lg hover:border-orange-500 hover:bg-orange-50 transition-all group w-full text-gray-800"
                                        >
                                            <div className="flex items-start justify-between mb-2">
                                                <div className="flex gap-2">
                                                    <span className={`
                                                        px-2 py-1 rounded text-xs font-semibold
                                                        ${question.difficulty === 'Easy' ? 'bg-green-200 text-green-800' : ''}
                                                        ${question.difficulty === 'Medium' ? 'bg-yellow-200 text-yellow-800' : ''}
                                                        ${question.difficulty === 'Hard' ? 'bg-red-200 text-red-800' : ''}
                                                    `}>
                                                        {question.difficulty || '普通'}
                                                    </span>
                                                    {question.subject && (
                                                        <span className="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">
                                                            {question.subject}
                                                        </span>
                                                    )}
                                                </div>
                                                <span className="text-orange-600 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    选择 →
                                                </span>
                                            </div>
                                            <p className="font-medium">{question.content}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showGroups && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-8 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[90%] flex flex-col overflow-hidden animate-bounce-in">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center">
                                    <h3 className="text-xl font-bold text-gray-800">随机分组结果</h3>
                                    <button onClick={() => setShowGroups(false)} className="p-2 hover:bg-gray-100 rounded-full"><Icons.X /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {groups.map((g, i) => (
                                        <div key={i} className="border border-gray-200 rounded-xl p-4 bg-gray-50">
                                            <div className="font-bold text-lg mb-2 text-blue-600 border-b border-gray-200 pb-2">第 {i+1} 组</div>
                                            <div className="flex flex-wrap gap-2">
                                                {g.map(s => (
                                                    <span key={s.id} className="bg-white px-2 py-1 rounded border border-gray-200 text-sm font-medium">
                                                        {s.name}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // >>> Student Manager (保持原样)
        const StudentManager = ({ allStudents, setStudents, classes, setClasses, activeClassId, setActiveClassId, questions }) => {
            const [newStudentName, setNewStudentName] = useState('');
            const [newClassName, setNewClassName] = useState('');
            const [viewingStudent, setViewingStudent] = useState(null);
            const fileInputRef = useRef(null);
            const [searchTerm, setSearchTerm] = useState('');

            const currentClassStudents = allStudents.filter(s => s.classId === activeClassId);

            const filteredStudents = useMemo(() => {
                if (!searchTerm) return currentClassStudents;
                return currentClassStudents.filter(s =>
                    s.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }, [currentClassStudents, searchTerm]);

            const handleAddClass = () => { if(!newClassName.trim()) return; const id = generateId(); setClasses([...classes, {id, name: newClassName.trim()}]); setNewClassName(''); setActiveClassId(id); };
            const handleDeleteClass = (id) => { if(classes.length <= 1) return alert("至少保留一个班级"); if(confirm('删除班级会同时删除该班级学生，确定吗？')) { setClasses(classes.filter(c => c.id !== id)); setStudents(allStudents.filter(s => s.classId !== id)); if(activeClassId === id) setActiveClassId(classes.find(c => c.id !== id).id); } };
            const handleAddStudent = () => { if(!newStudentName.trim() || !activeClassId) return; setStudents([...allStudents, { id: generateId(), classId: activeClassId, name: newStudentName.trim(), score: 0, history: [] }]); setNewStudentName(''); };
            const handleDeleteStudent = (id) => { if(confirm('确定删除吗？')) setStudents(allStudents.filter(s => s.id !== id)); };
            const handleUpdateScore = (id, newScore) => { setStudents(allStudents.map(s => s.id === id ? { ...s, score: newScore } : s)); };
            const handleFileUpload = (e) => { const f = e.target.files?.[0]; if(!f || !activeClassId) return; const r = new FileReader(); r.onload = (ev) => { const ns = ev.target.result.split(/\r?\n/).filter(l=>l.trim().length>0).map(n=>({id: generateId(), classId: activeClassId, name: n.replace(/["',]/g,'').trim(), score: 0, history: []})); setStudents([...allStudents, ...ns]); alert(`已导入 ${ns.length} 人`); if(fileInputRef.current) fileInputRef.current.value = ''; }; r.readAsText(f); };
            const handleResetClassScore = () => { if(confirm("确定要重置当前班级所有学生的积分吗？此操作不可撤销！")) { setStudents(allStudents.map(s => s.classId === activeClassId ? { ...s, score: 0 } : s)); }};
            const handleSingleClassExport = () => {
                const classData = { 
                    className: classes.find(c=>c.id===activeClassId)?.name, 
                    students: currentClassStudents, 
                    timestamp: Date.now(),
                    version: 3 
                };
                const blob = new Blob([JSON.stringify(classData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `${classData.className}_数据包.json`; a.click();
            };
            const handleExportHistory = (student) => {
                const csvHeader = "\uFEFF时间,学生姓名,题目内容,得分,结果\n";
                const rows = student.history.map(h => {
                    const q = questions.find(q => q.id === h.questionId);
                    const contentStr = h.questionContent || (q ? q.content : (h.questionId ? '(题目已删除)' : '手动调整'));
                    const time = new Date(h.timestamp).toLocaleString().replace(/,/g, ' ');
                    const content = `"${contentStr.replace(/"/g, '""')}"`;
                    const result = h.points > 0 ? "正确" : (h.points < 0 ? "错误" : "跳过/调整");
                    return `${time},${student.name},${content},${h.points},${result}`;
                }).join("\n");
                const blob = new Blob([csvHeader + rows], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `${student.name}_答题记录.csv`; a.click();
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center"><Icons.School /><span className="ml-2">班级管理</span></h3>
                        <div className="flex flex-wrap gap-4 items-center mb-4">{classes.map(c => <div key={c.id} onClick={()=>setActiveClassId(c.id)} className={`cursor-pointer px-4 py-2 rounded-lg border flex items-center space-x-2 transition ${activeClassId === c.id ? 'bg-indigo-50 border-indigo-200 text-indigo-700 font-medium' : 'bg-white border-gray-200'}`}><span>{c.name}</span>{activeClassId !== c.id && <button onClick={(e)=>{e.stopPropagation();handleDeleteClass(c.id)}} className="text-gray-300 hover:text-red-500"><Icons.Trash2 /></button>}</div>)}</div>
                        <div className="flex gap-4"><input type="text" value={newClassName} onChange={e=>setNewClassName(e.target.value)} placeholder="新班级名称..." className="p-2 border border-gray-300 rounded-lg text-sm w-48" /><button onClick={handleAddClass} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">创建新班级</button></div>
                    </div>
                    <div className="space-y-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="text-lg font-bold text-gray-800 mb-4 flex justify-between"><div>添加学生 <span className="text-sm font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">当前: {classes.find(c=>c.id===activeClassId)?.name}</span></div><div className="space-x-2"><button onClick={handleResetClassScore} className="px-3 py-1 bg-red-50 text-red-600 rounded text-sm hover:bg-red-100">重置本班积分</button><button onClick={handleSingleClassExport} className="px-3 py-1 bg-green-50 text-green-600 rounded text-sm hover:bg-green-100">导出本班数据包</button></div></h3>
                            <div className="flex gap-4 mb-4"><input type="text" value={newStudentName} onChange={e=>setNewStudentName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddStudent()} placeholder="输入姓名..." className="flex-1 p-3 border border-gray-300 rounded-lg" /><button onClick={handleAddStudent} className="px-6 py-3 bg-blue-600 text-white rounded-lg">添加</button></div>
                            <div className="pt-4 border-t border-gray-100 flex justify-between items-center"><span className="text-sm text-gray-500">支持批量导入 (TXT/CSV)</span><div className="relative"><input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".txt,.csv" className="hidden"/><button onClick={()=>fileInputRef.current?.click()} className="flex items-center space-x-2 text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg"><Icons.FileUp /><span>导入名单</span></button></div></div>
                            <div className="mt-4">
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={e => setSearchTerm(e.target.value)}
                                    placeholder="搜索学生姓名..."
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {filteredStudents.map(s => ( 
                                <div key={s.id} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between h-full">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg">{s.name.charAt(0)}</div>
                                            <div>
                                                <div className="font-semibold text-gray-800">{s.name}</div>
                                                <div className="text-xs text-gray-500 cursor-pointer hover:text-blue-600 underline" onClick={()=>{const n=prompt('修改分数:',s.score);if(n!==null)handleUpdateScore(s.id,parseInt(n)||0)}}>积分: {s.score}</div>
                                            </div>
                                        </div>
                                        <button onClick={()=>handleDeleteStudent(s.id)} className="text-gray-300 hover:text-red-500 p-1"><Icons.Trash2 className="w-4 h-4" /></button>
                                    </div>
                                    <div className="flex items-center justify-between pt-2 border-t border-gray-50">
                                        <div className="flex gap-1">
                                            <button onClick={()=>handleUpdateScore(s.id, s.score-1)} className="w-8 h-8 rounded bg-gray-100 hover:bg-red-100 hover:text-red-500 font-bold text-sm">-1</button>
                                            <button onClick={()=>handleUpdateScore(s.id, s.score+1)} className="w-8 h-8 rounded bg-gray-100 hover:bg-green-100 hover:text-green-500 font-bold text-sm">+1</button>
                                        </div>
                                        <button onClick={() => setViewingStudent(s)} className="text-xs flex items-center px-2 py-1 bg-blue-50 text-blue-600 rounded hover:bg-blue-100 transition"><Icons.FileText className="w-3 h-3 mr-1" />历史记录</button>
                                    </div>
                                </div>
                            ))}
                            {filteredStudents.length === 0 && <div className="col-span-full py-12 text-center text-gray-400">暂无数据</div>}
                        </div>
                    </div>

                    {viewingStudent && (
                        <div className="absolute inset-0 bg-black/50 z-50 flex items-center justify-center p-8 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90%] flex flex-col animate-bounce-in">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-2xl">
                                    <div className="flex items-center space-x-3">
                                        <div className="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">{viewingStudent.name.charAt(0)}</div>
                                        <div><h3 className="text-xl font-bold text-gray-800">{viewingStudent.name} 的答题档案</h3><p className="text-xs text-gray-500">当前积分: {viewingStudent.score}</p></div>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <button onClick={()=>handleExportHistory(viewingStudent)} className="flex items-center space-x-1 px-3 py-1.5 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 text-sm font-medium"><Icons.Download className="w-4 h-4" /><span>导出此人记录</span></button>
                                        <button onClick={() => setViewingStudent(null)} className="p-2 hover:bg-gray-200 rounded-full"><Icons.X /></button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-0">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0">
                                            <tr>
                                                <th className="px-6 py-3">时间</th>
                                                <th className="px-6 py-3">题目内容</th>
                                                <th className="px-6 py-3 text-center">得分</th>
                                                <th className="px-6 py-3 text-center">结果</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {viewingStudent.history.length === 0 ? (
                                                <tr><td colSpan="4" className="px-6 py-8 text-center text-gray-400">暂无答题记录</td></tr>
                                            ) : (
                                                [...viewingStudent.history].reverse().map((h, i) => {
                                                    const q = questions.find(q => q.id === h.questionId);
                                                    const content = h.questionContent || (q ? q.content : (h.questionId ? <span className="text-red-400 italic">(题目已删除)</span> : <span className="text-gray-400 italic">手动调整</span>));
                                                    
                                                    return (
                                                        <tr key={i} className="bg-white border-b hover:bg-gray-50">
                                                            <td className="px-6 py-4 whitespace-nowrap text-gray-500">{new Date(h.timestamp).toLocaleString()}</td>
                                                            <td className="px-6 py-4 text-gray-800 font-medium">
                                                                {content}
                                                            </td>
                                                            <td className="px-6 py-4 text-center font-bold">{h.points > 0 ? `+${h.points}` : h.points}</td>
                                                            <td className="px-6 py-4 text-center">
                                                                <span className={`px-2 py-1 rounded text-xs font-bold ${h.points > 0 ? 'bg-green-100 text-green-700' : h.points < 0 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'}`}>
                                                                    {h.points > 0 ? '正确' : h.points < 0 ? '错误' : '跳过/调整'}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // >>> Statistics (保持原样)
        const Statistics = ({ students, activeClass, questions }) => {
            if(!activeClass || students.length === 0) return <div className="flex flex-col items-center justify-center h-96 text-gray-500"><Icons.BarChart2 /><p className="mt-4">暂无数据</p></div>;
            
            const sorted = [...students].sort((a,b) => b.score - a.score);
            const maxScore = sorted[0]?.score || 0;
            const minScore = sorted[sorted.length-1]?.score || 0;
            const scoreRange = maxScore - minScore || 1;
            
            const enrichedStudents = sorted.map(s => {
                const recentRecords = s.history.slice(-5);
                const recentPerf = recentRecords.length > 0 
                    ? (recentRecords.reduce((sum, h) => sum + h.points, 0) / recentRecords.length).toFixed(1)
                    : 0;
                
                let trend = 'stable';
                if (recentRecords.length >= 2) {
                    const recent = recentRecords.slice(-2).reduce((sum, h) => sum + h.points, 0) / 2;
                    const older = recentRecords.slice(0, -2).length > 0 
                        ? recentRecords.slice(0, -2).reduce((sum, h) => sum + h.points, 0) / recentRecords.slice(0, -2).length
                        : recent;
                    if (recent > older + 0.3) trend = 'up';
                    else if (recent < older - 0.3) trend = 'down';
                }
                
                return {
                    ...s,
                    recentPerf,
                    trend,
                    participationCount: s.history.length,
                    normalizedScore: (s.score - minScore) / scoreRange
                };
            });
            
            const getTier = (normalized) => {
                if (normalized >= 0.8) return 'top';
                if (normalized >= 0.5) return 'good';
                if (normalized >= 0.2) return 'average';
                return 'needHelp';
            };
            
            const tiers = {
                top: { label: '🔥 优秀梯队', color: 'red', students: [] },
                good: { label: '⭐ 良好梯队', color: 'blue', students: [] },
                average: { label: '📊 中等梯队', color: 'gray', students: [] },
                needHelp: { label: '💪 进步空间', color: 'orange', students: [] }
            };
            
            enrichedStudents.forEach(s => {
                const tier = getTier(s.normalizedScore);
                tiers[tier].students.push(s);
            });

            return (
                <div className="max-w-5xl mx-auto space-y-8">
                    <div className="flex items-center space-x-2 mb-4">
                        <div className="h-8 w-1 bg-blue-500 rounded-full"></div>
                        <h2 className="text-xl font-bold text-gray-800">{activeClass.name} - 积分排行榜</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {enrichedStudents[1] && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center mt-4 hover:shadow-md transition">
                                <div className="text-5xl mb-2">🥈</div>
                                <div className="text-2xl font-bold text-gray-800">{enrichedStudents[1].name}</div>
                                <div className="text-xl text-gray-600 font-semibold mt-1">{enrichedStudents[1].score}</div>
                                <div className="text-xs text-gray-400 font-bold mt-2 uppercase">排名第二</div>
                            </div>
                        )}
                        {enrichedStudents[0] && (
                            <div className="bg-gradient-to-br from-yellow-300 to-yellow-500 p-8 rounded-2xl shadow-xl flex flex-col items-center relative z-10 transform hover:scale-105 transition">
                                <div className="text-6xl mb-3">🥇</div>
                                <div className="text-3xl font-black text-white">{enrichedStudents[0].name}</div>
                                <div className="text-2xl text-yellow-50 font-bold mt-2">{enrichedStudents[0].score}</div>
                                <div className="text-sm text-yellow-100 font-bold mt-3 uppercase tracking-widest">冠军</div>
                            </div>
                        )}
                        {enrichedStudents[2] && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col items-center mt-4 hover:shadow-md transition">
                                <div className="text-5xl mb-2">🥉</div>
                                <div className="text-2xl font-bold text-gray-800">{enrichedStudents[2].name}</div>
                                <div className="text-xl text-gray-600 font-semibold mt-1">{enrichedStudents[2].score}</div>
                                <div className="text-xs text-orange-400 font-bold mt-2 uppercase">排名第三</div>
                            </div>
                        )}
                    </div>

                    <div className="space-y-6">
                        {Object.entries(tiers).map(([tierKey, tierData]) => {
                            if (tierData.students.length === 0) return null;
                            
                            const tierMaxScore = Math.max(...tierData.students.map(s => s.score));
                            const tierColors = {
                                red: { bg: 'bg-red-50', border: 'border-red-200', text: 'text-red-600' },
                                blue: { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-600' },
                                gray: { bg: 'bg-gray-50', border: 'border-gray-200', text: 'text-gray-600' },
                                orange: { bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-600' }
                            };
                            
                            const colors = tierColors[tierData.color];
                            
                            return (
                                <div key={tierKey} className={`${colors.bg} ${colors.border} border-2 rounded-xl p-6 shadow-sm`}>
                                    <div className="flex items-center justify-between mb-4">
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-800">{tierData.label}</h3>
                                        </div>
                                        <div className={`px-4 py-2 bg-white rounded-lg font-semibold ${colors.text}`}>
                                            {tierData.students.length} 位学生
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-3">
                                        {tierData.students.map((s, idx) => {
                                            const tierRank = tierData.students.indexOf(s) + 1;
                                            const progressWidth = tierMaxScore > 0 ? (s.score / tierMaxScore) * 100 : 0;
                                            
                                            return (
                                                <div key={s.id} className="bg-white rounded-lg p-4 hover:shadow-md transition group">
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-white ${
                                                            tierData.color === 'red' ? 'bg-red-500' :
                                                            tierData.color === 'blue' ? 'bg-blue-500' :
                                                            tierData.color === 'gray' ? 'bg-gray-500' :
                                                            'bg-orange-500'
                                                        }`}>
                                                            #{enrichedStudents.indexOf(s) + 1}
                                                        </div>
                                                        
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center justify-between mb-2">
                                                                <div className="flex items-center gap-3 flex-1">
                                                                    <span className="font-bold text-lg text-gray-800">{s.name}</span>
                                                                    <span className="text-xl">
                                                                        {s.trend === 'up' && '📈'}
                                                                        {s.trend === 'down' && '📉'}
                                                                        {s.trend === 'stable' && '➡️'}
                                                                    </span>
                                                                </div>
                                                                
                                                                <div className="flex items-center gap-4 flex-shrink-0">
                                                                    <div className="text-right">
                                                                        <div className={`text-2xl font-bold ${colors.text}`}>
                                                                            {s.score}
                                                                        </div>
                                                                        <div className="text-xs text-gray-500">积分</div>
                                                                    </div>
                                                                    
                                                                    <div className="text-right">
                                                                        <div className="text-lg font-semibold text-gray-700">
                                                                            {s.participationCount}
                                                                        </div>
                                                                        <div className="text-xs text-gray-500">次</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="relative h-6 bg-gray-200 rounded-full overflow-hidden">
                                                                <div 
                                                                    className={`h-full rounded-full transition-all duration-1000 ease-out ${
                                                                        tierData.color === 'red' ? 'bg-gradient-to-r from-red-400 to-red-600' :
                                                                        tierData.color === 'blue' ? 'bg-gradient-to-r from-blue-400 to-blue-600' :
                                                                        tierData.color === 'gray' ? 'bg-gradient-to-r from-gray-400 to-gray-600' :
                                                                        'bg-gradient-to-r from-orange-400 to-orange-600'
                                                                    }`}
                                                                    style={{ width: `${Math.max(5, progressWidth)}%` }}
                                                                />
                                                                
                                                                <div className="absolute inset-0 flex items-center justify-between px-3 text-xs font-semibold">
                                                                    <span className="text-white drop-shadow">
                                                                        {progressWidth > 5 ? `${progressWidth.toFixed(0)}%` : ''}
                                                                    </span>
                                                                    <span className="text-gray-600 drop-shadow">
                                                                        近期: {s.recentPerf}分/次
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    
                                                    <div className="mt-3 max-h-0 overflow-hidden group-hover:max-h-32 transition-all">
                                                        <div className="pt-3 border-t border-gray-200 flex gap-2 flex-wrap">
                                                            {s.history.slice(-5).reverse().map((record, i) => (
                                                                <span 
                                                                    key={i}
                                                                    className={`
                                                                        px-2 py-1 rounded text-xs font-medium
                                                                        ${record.points > 0 ? 'bg-green-100 text-green-700' : record.points < 0 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}
                                                                    `}
                                                                    title={s.history[s.history.length - 1 - i]?.questionContent || ''}
                                                                >
                                                                    {record.points > 0 ? '+' : ''}{record.points}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // >>> Dashboard
        const Dashboard = ({ state, setView, activeClass }) => (
            <div className="max-w-6xl mx-auto">
                <div className="mb-12"><h1 className="text-4xl font-extrabold text-gray-900 mb-2">欢迎回来, 老师</h1><p className="text-gray-500 text-lg">当前正在管理: <span className="font-bold text-blue-600">{activeClass?.name || "请选择班级"}</span></p></div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div onClick={()=>setView(ViewState.SESSION)} className="group bg-gradient-to-br from-blue-500 to-blue-600 rounded-3xl p-8 text-white shadow-lg cursor-pointer hover:scale-105 transition transform"><Icons.PlayCircle className="w-12 h-12" /><h3 className="text-2xl font-bold mt-4">快速开始</h3><p className="text-blue-100">进入随机抽查与积分模式</p></div>
                    <div onClick={()=>setView(ViewState.STUDENTS)} className="group bg-white rounded-3xl p-8 border border-gray-100 shadow-sm cursor-pointer hover:shadow-xl transition"><Icons.School className="w-12 h-12 text-gray-600" /><h3 className="text-2xl font-bold mt-4 text-gray-800">班级与学生</h3><div className="text-3xl font-black text-gray-900 mt-2">{state.students.filter(s=>s.classId===activeClass?.id).length} 人</div></div>
                    <div onClick={()=>setView(ViewState.QUESTIONS)} className="group bg-white rounded-3xl p-8 border border-gray-100 shadow-sm cursor-pointer hover:shadow-xl transition"><Icons.BookOpen className="w-12 h-12 text-gray-600" /><h3 className="text-2xl font-bold mt-4 text-gray-800">题库管理</h3><div className="text-3xl font-black text-gray-900 mt-2">{state.questions.length} 题</div></div>
                </div>
            </div>
        );

        // >>> App Controller
        const App = () => {
            const [state, setState] = useState(emptyClassroomState());
            const [currentView, setCurrentView] = useState(ViewState.DASHBOARD);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                let cancelled = false;

                async function loadCloudData() {
                    setLoading(true);
                    setError(null);
                    try {
                        const boot = await ClassroomAPI.bootstrap();
                        const classes = (boot.classes || []).map(c => ({
                            id: c.id,
                            name: c.name
                        }));
                        const activeClassId = classes.length > 0 ? classes[0].id : null;
                        const students = activeClassId
                            ? (await ClassroomAPI.getStudents(activeClassId)).map(s => ({
                                id: s.id,
                                name: s.display_name || s.username,
                                classId: activeClassId,
                                score: 0
                            }))
                            : [];
                        const questions = await ClassroomAPI.getQuestions({ limit: 50 });

                        if (!cancelled) {
                            setState({
                                classes,
                                activeClassId,
                                students,
                                questions,
                                activeSession: boot.active_session || null,
                                sessionState: {},
                                _apiLoaded: true
                            });
                        }
                    } catch (err) {
                        if (!cancelled) {
                            setError(err.message || '课堂数据加载失败，请刷新重试');
                        }
                    } finally {
                        if (!cancelled) setLoading(false);
                    }
                }

                loadCloudData();
                return () => { cancelled = true; };
            }, []);

            const handleSmartImport = (data) => {
                if(data.students && data.className && !data.classes) {
                    if(confirm(`检测到班级数据包: "${data.className}"\n要将其导入并替换当前选中班级吗？`)) {
                         const currentClassId = state.activeClassId;
                         const updatedStudents = state.students.filter(s => s.classId !== currentClassId);
                         const newStudents = data.students.map(s => ({...s, classId: currentClassId}));
                         const updatedClasses = state.classes.map(c => c.id === currentClassId ? { ...c, name: data.className } : c);

                         setState(prev => ({
                             ...prev, 
                             classes: updatedClasses,
                             students: [...updatedStudents, ...newStudents]
                         }));
                         alert("导入成功！已自动更新班级名称与学生名单。");
                    }
                } else {
                    const defaultState = { classes: [], activeClassId: null, students: [], questions: [] };
                    const merged = { ...defaultState, ...data };
                    
                    if(!Array.isArray(merged.students)) merged.students = [];
                    if(!Array.isArray(merged.questions)) merged.questions = [];
                    if(!Array.isArray(merged.classes)) merged.classes = [];
                    if(merged.classes.length === 0) {
                        const cid = generateId(); 
                        merged.classes = [{id: cid, name: '默认班级'}]; 
                        merged.activeClassId = cid;
                    }

                    setState(merged); 
                }
            }

            const updateStudents = (s) => setState(prev => ({ ...prev, students: s }));
            const updateClasses = (c) => setState(prev => ({ ...prev, classes: c }));
            const setActiveClass = (id) => setState(prev => ({ ...prev, activeClassId: id }));
            const updateQuestions = (q) => setState(prev => ({ ...prev, questions: q }));

            // 错误状态
            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="bg-white border border-red-200 rounded-lg p-6 max-w-md shadow-lg">
                            <h2 className="text-lg font-semibold text-red-700 mb-2">课堂数据加载失败</h2>
                            <p className="text-sm text-gray-600 mb-4">{error}</p>
                            <button onClick={() => location.reload()} className="px-4 py-2 bg-green-700 text-white rounded-md hover:bg-green-800">
                                重新加载
                            </button>
                        </div>
                    </div>
                );
            }

            // 加载状态
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-green-700 mx-auto mb-4"></div>
                            <p className="text-gray-600">正在加载课堂数据...</p>
                        </div>
                    </div>
                );
            }

            const activeClass = state.classes.find(c => c.id === state.activeClassId) || null;

            return (
                <Layout currentView={currentView} setView={setCurrentView} classes={state.classes} activeClassId={state.activeClassId} setActiveClassId={setActiveClass} showDrawHistory={currentView === ViewState.SESSION}>
                    {currentView === ViewState.DASHBOARD && <Dashboard state={state} setView={setCurrentView} activeClass={activeClass} />}
                    {currentView === ViewState.STUDENTS && <StudentManager allStudents={state.students} setStudents={updateStudents} classes={state.classes} setClasses={updateClasses} activeClassId={state.activeClassId} setActiveClassId={setActiveClass} questions={state.questions} />}
                    {currentView === ViewState.QUESTIONS && <QuestionManager questions={state.questions} setQuestions={updateQuestions} />}
                    {currentView === ViewState.SESSION && <SessionMode students={state.students.filter(s=>s.classId===state.activeClassId)} questions={state.questions} onUpdateStudent={(u) => updateStudents(state.students.map(s => s.id === u.id ? u : s))} activeClass={activeClass} />}
                    {currentView === ViewState.STATS && <Statistics students={state.students.filter(s=>s.classId===state.activeClassId)} activeClass={activeClass} questions={state.questions} />}
                    {currentView === ViewState.DATA && <DataCenter state={state} setState={handleSmartImport} />}
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
