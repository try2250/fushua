{% extends "base.html" %}
{% block content %}
<h2>公告管理</h2>
<a href="/platform/announcements/create">新建公告</a>
<table>
  <thead><tr><th>ID</th><th>标题</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td>{{ r.id }}</td><td>{{ r.title }}</td>
      <td>{% if r.is_active %}启用{% else %}禁用{% endif %}</td>
      <td>
        <a href="/platform/announcements/{{ r.id }}/edit">编辑</a>
        <form method="post" action="/platform/announcements/{{ r.id }}/toggle" style="display:inline"><button>{% if r.is_active %}禁用{% else %}启用{% endif %}</button></form>
        <form method="post" action="/platform/announcements/{{ r.id }}/delete" style="display:inline"><button>删除</button></form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
